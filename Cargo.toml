[workspace]
resolver = "2"
members = [
    "crates/helix-protocol",
    "crates/helix-charter",
    "crates/helix-memory",
    "crates/helixd",
    "crates/helix-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vk-ai/helix"
homepage = "https://github.com/vk-ai/helix"
authors = ["Helix contributors"]
rust-version = "1.75"

[workspace.dependencies]
helix-protocol = { path = "crates/helix-protocol" }
helix-charter = { path = "crates/helix-charter" }
helix-memory = { path = "crates/helix-memory" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
